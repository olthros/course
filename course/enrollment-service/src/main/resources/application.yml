server:
  port: 8083
spring:
  application:
    name: enrollment-service
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
      resilience4j:
        disable-time-limiter: true
        disable-thread-pool: true
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: COURSE_GROUP
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enrollment_db}
    username: ${DB_USER:course}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
resilience4j:
  circuitbreaker:
    configs:
      remote:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$BadRequest
    instances:
      StudentClientfindByIdString:
        base-config: remote
      CatalogClientoccupyString:
        base-config: remote
      CatalogClientreleaseString:
        base-config: remote
