name: course-microservices

services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set in .env}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
      - "127.0.0.1:${NACOS_HTTP_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    volumes: [nacos-data:/home/nacos/data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --data-urlencode 'username=nacos'
          --data-urlencode "password=$${NACOS_PASSWORD}"
          http://localhost:8848/nacos/v3/auth/user/login | grep -q accessToken
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [course-network]

  user-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: user_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
    volumes: [user-data:/var/lib/mysql]
    networks: [course-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  catalog-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
    volumes: [catalog-data:/var/lib/mysql]
    networks: [course-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  enrollment-db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: enrollment_db
      MYSQL_USER: course
      MYSQL_PASSWORD: ${ENROLLMENT_DB_PASSWORD:?set in .env}
    volumes: [enrollment-data:/var/lib/mysql]
    networks: [course-network]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  user-service:
    image: course-user-service:week08
    build: ./user-service
    ports: ["${USER_PORT:-8081}:8081"]
    environment:
      DB_URL: jdbc:mysql://user-db:3306/user_db
      DB_USER: course
      DB_PASSWORD: ${USER_DB_PASSWORD:?set in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [course-network]

  catalog-service:
    image: course-catalog-service:week08
    build: ./catalog-service
    ports: ["${CATALOG_PORT:-8082}:8082"]
    environment:
      DB_URL: jdbc:mysql://catalog-db:3306/catalog_db
      DB_USER: course
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      catalog-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [course-network]

  enrollment-service:
    image: course-enrollment-service:week08
    build: ./enrollment-service
    ports: ["${ENROLLMENT_PORT:-8083}:8083"]
    environment:
      DB_URL: jdbc:mysql://enrollment-db:3306/enrollment_db
      DB_USER: course
      DB_PASSWORD: ${ENROLLMENT_DB_PASSWORD:?set in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?set in .env}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      enrollment-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
    networks: [course-network]

volumes:
  nacos-data:
  user-data:
  catalog-data:
  enrollment-data:

networks:
  course-network:
